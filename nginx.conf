worker_processes auto;
events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # Proxy cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Hide NGINX version to prevent information disclosure
    server_tokens off;

    # Remove the 'Server: nginx' header completely
    more_clear_headers 'Server';

    # Hide all upstream server banners, technology fingerprints, and framework versions
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header X-Nextjs-Version;
    proxy_hide_header x-nextjs-cache;
    proxy_hide_header x-nextjs-prerender;
    proxy_hide_header x-nextjs-stale-time;
    proxy_hide_header x-nextjs-matched-path;
    proxy_hide_header x-matched-path;
    proxy_hide_header x-nextjs-redirect;
    proxy_hide_header x-nextjs-postponed;
    proxy_hide_header x-nextjs-route-type;
    proxy_hide_header X-Middleware-Rewrite;
    proxy_hide_header X-Middleware-Cache;
    proxy_hide_header X-Middleware-Subrequest;
    proxy_hide_header X-Middleware-Next;
    proxy_hide_header x-middleware-override-headers;
    proxy_hide_header x-middleware-request-headers;
    proxy_hide_header X-Runtime;
    proxy_hide_header X-Version;
    proxy_hide_header X-Page-Speed;
    proxy_hide_header X-SourceFiles;
    proxy_hide_header X-Fastcgi-Cache;

    # Prevent duplicate security headers: hide upstream security headers so NGINX sets them authoritatively
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;

    # Cache bypass for authenticated users
    map $http_cookie $skip_cache {
        default 0;
        "~*session|auth|token|__s_" 1; # __s_ is the prefix for obfuscated cookies
    }

    # [FIX 1] Fixed log format: $remote_addr was logged twice; replaced second with $remote_user
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/json
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/atom+xml;

    # [FIX 5] Rate limiting zones — protect auth and payment endpoints from abuse
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

    # Limit maximum concurrent connections per client IP to mitigate DDoS/Slowloris
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Intrusion detection map: identify vulnerability scanners and automated exploitation tools
    map $http_user_agent $bad_bot {
        default 0;
        "~*(nikto|sqlmap|acunetix|masscan|nmap|zgrab|nessus|openvas|dirbuster|gobuster|wpscan|censys|shodan|morfeus|semrush|ahrefsbot|dotbot)" 1;
    }

    # MinIO is external to the Docker Compose network.
    upstream minio_backend {
        server 192.168.1.6:9000;
    }


    # Route backend APIs through one HTTP listener.
    server {
        listen 80 default_server;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_backend auth-service:3002;
        set $stocks_backend stocks-service:3003;
        set $ticketing_backend ticketing-service:3001;
        set $payments_backend payments-service:3004;
        set $storage_backend storage-service:3005;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        limit_conn conn_limit 40;

        if ($bad_bot = 1) {
            return 403;
        }

        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        location = /health {
            access_log off;
            return 200 "Gateway OK\n";
            add_header Content-Type text/plain always;
        }

        location /api/auth/panel/forgot-password {
            limit_req zone=auth_limit burst=50 nodelay;
            proxy_pass http://$stocks_backend;
        }

        location ~ ^/api/auth/(admin|cms|support|marketing|accounting|operation)/(login|logout|verify)$ {
            limit_req zone=auth_limit burst=50 nodelay;
            proxy_pass http://$auth_backend;
            proxy_set_header X-Forwarded-Prefix /api/auth;
        }

        location /api/auth {
            limit_req zone=auth_limit burst=50 nodelay;
            proxy_pass http://$auth_backend;
            proxy_set_header X-Forwarded-Prefix /api/auth;
        }

        location /api/content {
            proxy_pass http://$stocks_backend;
            proxy_set_header X-Forwarded-Prefix /api/content;
        }

        location /api/baskets {
            proxy_pass http://$stocks_backend;
            proxy_set_header X-Forwarded-Prefix /api/baskets;
        }

        location /api/upload/ {
            proxy_pass http://$storage_backend;
            proxy_set_header X-Forwarded-Prefix /api/upload;
        }

        location /api/storage/ {
            proxy_pass http://$storage_backend;
            proxy_set_header X-Forwarded-Prefix /api/storage;
        }

        location /api/stocks {
            proxy_cache api_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;
            add_header X-Cache $upstream_cache_status always;
            proxy_pass http://$stocks_backend;
            proxy_set_header X-Forwarded-Prefix /api/stocks;
        }

        location /api/tickets {
            proxy_pass http://$ticketing_backend;
            proxy_set_header X-Forwarded-Prefix /api/tickets;
        }

        location /api/payments {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://$payments_backend;
            proxy_set_header X-Forwarded-Prefix /api/payments;
        }

        location /api/labels {
            proxy_pass http://$ticketing_backend;
            proxy_set_header X-Forwarded-Prefix /api/labels;
        }

        location /api/ {
            proxy_pass http://$stocks_backend;
            proxy_set_header X-Forwarded-Prefix /api;
        }

        location /storage/ {
            rewrite ^/storage/(.*) /$1 break;
            proxy_pass http://minio_backend;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            chunked_transfer_encoding off;
        }

        location / {
            return 404;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* \.(bak|conf|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 500 '{"statusCode":500,"message":"Service temporarily unavailable. Please try again later."}';
        }
    }
}
