# Environment variables loaded from .env.staging file (copy from .env.staging.example)
# See docs/ENVIRONMENT_SETUP.md for detailed setup instructions

services:
  nginx:
    image: fabiocicerchia/nginx-lua:1.25.3-alpine
    container_name: nginx-staging
    extra_hosts:
      - "host-gateway:host-gateway"   
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - auth-service
      - stocks-service
      - ticketing-service
      - payments-service
      - storage-service
    restart: unless-stopped
    networks:
      staging-network:
        aliases:
          - nginx-staging
          - nginx
    mem_limit: 100m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: auth-service:staging
    container_name: auth-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
      ALLOW_CONSOLE_OTP_FALLBACK: ${ALLOW_CONSOLE_OTP_FALLBACK}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${AUTH_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  stocks-service:
    build:
      context: .
      dockerfile: apps/stocks-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: stocks-service:staging
    container_name: stocks-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${STOCKS_SERVICE_PORT}
      NODE_OPTIONS: ${STOCKS_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${STOCKS_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  esign-worker:
    build:
      context: .
      dockerfile: apps/stocks-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: esign-worker:staging
    command: ["node", "dist/esign-worker.js"]
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      ESIGN_CONCURRENCY: ${ESIGN_CONCURRENCY}
      NODE_OPTIONS: ${ESIGN_NODE_OPTIONS}
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - staging-network
    mem_limit: ${ESIGN_WORKER_MEMORY}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  ticketing-service:
    build:
      context: .
      dockerfile: apps/ticketing-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
        TICKETING_DATABASE_URL: ${TICKETING_DATABASE_URL}
    image: ticketing-service:staging
    container_name: ticketing-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${TICKETING_SERVICE_PORT}
      TICKETING_DATABASE_URL: ${TICKETING_DATABASE_URL}
      NODE_OPTIONS: ${TICKETING_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${TICKETING_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  payments-service:
    build:
      context: .
      dockerfile: apps/payments-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: payments-service:staging
    container_name: payments-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PAYMENTS_SERVICE_PORT}
      NODE_OPTIONS: ${PAYMENTS_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${PAYMENTS_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  storage-service:
    build:
      context: .
      dockerfile: apps/storage-service/Dockerfile
      network: host
    image: storage-service:staging
    container_name: storage-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${STORAGE_SERVICE_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    develop:
      watch:
        - action: rebuild
          path: ./apps/storage-service
        - action: rebuild
          path: ./packages
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
    restart: unless-stopped
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${STORAGE_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 3

  postgres:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.state/postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  staging-network:
    external: true
    name: smc-staging-network
