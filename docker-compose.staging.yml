# Environment variables loaded from .env.staging file (copy from .env.staging.example)
# See docs/ENVIRONMENT_SETUP.md for detailed setup instructions

services:
  nginx:
    image: fabiocicerchia/nginx-lua:1.25.3-alpine
    container_name: smc-nginx-staging
    extra_hosts:
      - "host-gateway:host-gateway"   
    ports:
      - "80:80"
      - "90:90"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - auth-service
      - stocks-service
      - ticketing-service
      - payments-service
    restart: unless-stopped
    networks:
      staging-network:
        aliases:
          - smc-nginx-staging
          - nginx
    mem_limit: 100m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: smc-auth-service:staging
    container_name: smc-auth-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
      ALLOW_CONSOLE_OTP_FALLBACK: ${ALLOW_CONSOLE_OTP_FALLBACK}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${AUTH_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  stocks-service:
    build:
      context: .
      dockerfile: apps/stocks-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: smc-stocks-service:staging
    container_name: smc-stocks-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${STOCKS_SERVICE_PORT}
      NODE_OPTIONS: ${STOCKS_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${STOCKS_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  esign-worker:
    build:
      context: .
      dockerfile: apps/stocks-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: smc-esign-worker:staging
    command: ["node", "dist/esign-worker.js"]
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      ESIGN_CONCURRENCY: ${ESIGN_CONCURRENCY}
      NODE_OPTIONS: ${ESIGN_NODE_OPTIONS}
    restart: unless-stopped
    stop_grace_period: 120s
    networks:
      - staging-network
    mem_limit: ${ESIGN_WORKER_MEMORY}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  ticketing-service:
    build:
      context: .
      dockerfile: apps/ticketing-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
        TICKETING_DATABASE_URL: ${TICKETING_DATABASE_URL}
    image: smc-ticketing-service:staging
    container_name: smc-ticketing-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${TICKETING_SERVICE_PORT}
      DATABASE_URL: ${TICKETING_DATABASE_URL}
      NODE_OPTIONS: ${TICKETING_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${TICKETING_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  payments-service:
    build:
      context: .
      dockerfile: apps/payments-service/Dockerfile
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: smc-payments-service:staging
    container_name: smc-payments-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PAYMENTS_SERVICE_PORT}
      NODE_OPTIONS: ${PAYMENTS_NODE_OPTIONS}
    restart: unless-stopped
    networks:
      - staging-network
    mem_limit: 250m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${PAYMENTS_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  storage-service:
    build:
      context: .
      dockerfile: apps/storage-service/Dockerfile
      network: host
    image: smc-storage-service:staging
    container_name: smc-storage-staging
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${STORAGE_SERVICE_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    develop:
      watch:
        - action: rebuild
          path: ./apps/storage-service
        - action: rebuild
          path: ./packages
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
    restart: unless-stopped
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:${STORAGE_SERVICE_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 3

  postgres:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: smc-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./.state/postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    container_name: smc-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        BACKEND_ORIGIN: ${BACKEND_ORIGIN}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    environment:
      NODE_OPTIONS: ${WEB_NODE_OPTIONS}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      # Next.js profile/signout handlers run at runtime; use the internal service
      # instead of depending on the public gateway used by BACKEND_ORIGIN.
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
      GTM_ID: ${GTM_ID}
      SMARTPING_API_KEY: ${SMARTPING_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    restart: unless-stopped
    networks:
      - staging-network

  panels:
    container_name: smc-panels
    build:
      context: .
      dockerfile: apps/panels/Dockerfile
      network: host
      args:
        BACKEND_ORIGIN: ${BACKEND_ORIGIN}
    ports:
      - "4000:4000"
    env_file:
      - apps/panels/.env
    environment:
      NODE_OPTIONS: ${PANELS_NODE_OPTIONS}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    restart: unless-stopped
    networks:
      - staging-network

  rm-distributors:
    container_name: smc-rm-distributors
    build:
      context: .
      dockerfile: apps/rm-distributors/Dockerfile
      network: host
      args:
        BACKEND_ORIGIN: ${BACKEND_ORIGIN}
    ports:
      - "8000:8000"
    env_file:
      - apps/rm-distributors/.env
    environment:
      NODE_OPTIONS: ${RM_DISTRIBUTORS_NODE_OPTIONS}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    restart: unless-stopped
    networks:
      - staging-network

networks:
  staging-network:
    external: true
    name: smc-staging-network
