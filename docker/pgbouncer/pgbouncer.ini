[databases]
; Main application database — all 4 services connect here
; Points to the dedicated PostgreSQL server on the private network
unlisted_stox_db = host=10.0.2.20 port=5432 dbname=unlisted

; Ticketing database — ticketing-service connects here
ticketing_system = host=10.0.2.20 port=5432 dbname=ticketing_system

[pgbouncer]
; Listen on all interfaces inside the container
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction pooling: each SQL transaction gets a server connection,
; then it is returned to the pool. Required for Prisma compatibility.
pool_mode = transaction

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool sizing
; max_client_conn: how many connections your app services can open to PgBouncer
max_client_conn = 1000

; default_pool_size: how many real PostgreSQL connections PgBouncer maintains PER database
default_pool_size = 20

; reserve_pool_size: extra connections activated under burst load
reserve_pool_size = 5

; reserve_pool_timeout: seconds to wait before activating reserve connections
reserve_pool_timeout = 3

; Timeouts
; server_idle_timeout: close idle server connections after 10 minutes
server_idle_timeout = 600

; client_idle_timeout: disconnect idle clients after 5 minutes
client_idle_timeout = 300

; server_login_retry: retry connecting to PostgreSQL after 1 second
server_login_retry = 1

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Admin access (for SHOW POOLS, SHOW STATS, etc.)
admin_users = postgres
stats_users = postgres

; Ignore startup parameters that Prisma sends but PgBouncer doesn't need
ignore_startup_parameters = extra_float_digits,options
